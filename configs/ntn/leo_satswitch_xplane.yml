# TWO SATELLITES IN DIFFERENT ORBITAL PLANES, for positioning. OVERLAY on leo_rfsim_gnb.yml, like
# leo_satswitch.yml, which this file is a copy of with ONE change: satellite 2 is satellite 1's state vector
# ROTATED 90 DEGREES ABOUT THE EARTH'S AXIS - (x, y) -> (-y, x) on both position and velocity.

cell_cfg:
  ntn:
    # 5 s, the 3GPP-suggested LEO value, so the UE re-reads SIB19 roughly every 2.5 s and cannot drift far on a
    # stale ephemeris across the switch. The base config uses 30 s, which is comfortable for a single pass but
    # leaves up to 15 s of extrapolation - far too long when the drift reverses sign.
    ntn_ul_sync_validity_dur: 5

    # When satellite 1 stops serving this area. Stamped by scripts/run_leo_satswitch_rfsim.sh to the crossover,
    # epoch + 252 s. derive_post_switch_config() requires this to be set, and schedules the promotion for exactly
    # this instant (ntn_configuration_manager_impl.cpp:232).
    t_service: '2026-09-22T09:03:01'

    sat_switch_with_resync:
      # The SAME propagator as the serving satellite (the base config sets keplerian).
      propagator_type: keplerian
      # Satellite 2: same 600 km circular polar orbit, same epoch, trailing satellite 1 by exactly 16
      # degrees of true anomaly.
      epoch_timestamp: '2026-09-22T09:01:01'
      ephemeris_info_ecef:
        pos_x: 2826323.2
        pos_y: 0
        pos_z: 6356752.3
        vel_x: -6916.62
        vel_y: 0
        vel_z: 3075.25

      # Same instant as the serving cell's t_service: satellite 2 starts serving as satellite 1 stops.
      t_service_start: '2026-09-22T09:03:01'

      use_state_vector: true            # the OAI UE only decodes positionVelocity-r17
      ntn_ul_sync_validity_dur: 5

      # The point of the whole file. Without it the switch is only ADVERTISED in SIB19 and the serving cell keeps
      # flying satellite 1 past its horizon; with it, derive_post_switch_config() promotes satellite 2 to be the
      # serving satellite at t_service, which is what makes the emulated channel follow.
      promote_to_serving: true
      promote_neighbors: false

log:
  filename: /tmp/gnb_leo_satswitch.log
