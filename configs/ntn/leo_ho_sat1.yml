# Inter-satellite handover, satellite 1 of 2. Overlay on configs/ntn/leo_rfsim_gnb.yml.
#   gnb -c configs/ntn/leo_rfsim_gnb.yml -c configs/ntn/leo_ho_sat1.yml

gnb_id: 411
ran_node_name: gnb-sat1

cu_cp:
  # SD-Core, and it is REQUIRED for a handover to complete.
  amf:
    addr: 192.168.1.115
    bind_addr: 192.168.1.117
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
                sd: "010203"

  xnap:
    gateways:
      - bind_addrs:
          - 127.0.0.1
        connections:
          - peer_addrs:
              - 127.0.0.2

  mobility:
    # Handover is triggered by hand with the gNB's "ho" console command, not from measurements.
    trigger_handover_from_measurements: false
    cells:
      - nr_cell_id: 0x66C000            # this gNB's own cell: gnb_id 411 << 14
        periodic_report_cfg_id: 1
        ncells:
          - nr_cell_id: 0x670000
            report_configs: [2]
      - nr_cell_id: 0x670000            # satellite 2's cell, as a neighbour
        ncells:
          - nr_cell_id: 0x66C000
            report_configs: [2]
        gnb_id_bit_length: 22
        pci: 2
        plmn: "00101"
        tac: 1
        # Same carrier as this cell: the two cells are intra-frequency and their samples sum in the one
        # rfsimulator stream. Verified working that way on this host in the band 78 Xn handover run.
        ssb_arfcn: 436610
        band: 256
        ssb_scs: 15
        ssb_period: 10
        ssb_offset: 0
        ssb_duration: 5
    report_configs:
      - report_cfg_id: 1
        report_type: periodical
        report_interval_ms: 1024
      - report_cfg_id: 2
        report_type: event_triggered
        event_triggered_report_type: a3
        meas_trigger_quantity: rsrp
        meas_trigger_quantity_offset_db: 3
        hysteresis_db: 0
        time_to_trigger_ms: 100
        report_interval_ms: 1024

cu_up:
  ngu:
    socket:
      - bind_addr: 192.168.1.117

ru_sdr:
  # CLIENT, not server.
  device_args: serveraddr=127.0.0.1,serverport=4043,options=chanmod,realtime

  # tx_gain_backoff is deliberately NOT set here: this cell keeps the base config's 12 dB, which is the value the
  # attach was tuned on. Satellite 2 keeps it too - see leo_ho_sat2.yml for the measurements ruling out any power
  # separation between the two cells.

cell_cfg:
  # SD-Core is provisioned for sst 1 / sd 0x010203 (66051), not the base config's sd 1.
  # This, the tai_slice_support_list above and the UE's --uicc0.nssai_sd must all agree.
  slicing:
    - sst: 1
      sd: 66051

  pci: 1

  ntn:
    # THE FIRST SATELLITE, restated here rather than inherited from the base config.
    propagator_type: keplerian
    cell_specific_koffset: 40
    ntn_ul_sync_validity_dur: 30
    emulate_doppler: false
    use_state_vector: true
    reference_location:
      latitude: 90.0
      longitude: 0.0
    ephemeris_info_ecef:
      pos_x: 0
      pos_y: -930872.4
      pos_z: 6894191.7
      vel_x: 0
      vel_y: 7501.40
      vel_z: 1012.86

log:
  filename: /tmp/gnb_leo_sat1.log

pcap:
  ngap_filename: /tmp/ntn_leo_sat1_ngap.pcap
  xnap_enable: true
  xnap_filename: /tmp/ntn_leo_sat1_xnap.pcap
