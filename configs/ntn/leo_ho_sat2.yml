# Inter-satellite handover, satellite 2 of 2. OVERLAY on configs/ntn/leo_rfsim_gnb.yml:
#
#   gnb -c configs/ntn/leo_rfsim_gnb.yml -c configs/ntn/leo_ho_sat2.yml
#
# See configs/ntn/leo_ho_sat1.yml for how the overlay works and why there are two gNB processes.

gnb_id: 412
ran_node_name: gnb-sat2

cu_cp:
  # Local OAI core, matching leo_ho_sat1.yml - see the note there on SD-Core, which is up and does path switch
  # properly but has not got this UE provisioned.
  amf:
    addr: 192.168.1.115
    bind_addr: 192.168.1.120
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
                sd: "010203"

  xnap:
    gateways:
      - bind_addrs:
          - 127.0.0.2
        connections:
          - peer_addrs:
              - 127.0.0.1

  mobility:
    trigger_handover_from_measurements: false
    cells:
      - nr_cell_id: 0x670000            # this gNB's own cell: gnb_id 412 << 14
        periodic_report_cfg_id: 1
        ncells:
          - nr_cell_id: 0x66C000
            report_configs: [2]
      - nr_cell_id: 0x66C000            # satellite 1's cell, as a neighbour
        ncells:
          - nr_cell_id: 0x670000
            report_configs: [2]
        gnb_id_bit_length: 22
        pci: 1
        plmn: "00101"
        tac: 1
        ssb_arfcn: 436610
        band: 256
        ssb_scs: 15
        ssb_period: 10
        ssb_offset: 0
        ssb_duration: 5
    report_configs:
      - report_cfg_id: 1
        report_type: periodical
        report_interval_ms: 1024
      - report_cfg_id: 2
        report_type: event_triggered
        event_triggered_report_type: a3
        meas_trigger_quantity: rsrp
        meas_trigger_quantity_offset_db: 3
        hysteresis_db: 0
        time_to_trigger_ms: 100
        report_interval_ms: 1024

cu_up:
  ngu:
    socket:
      - bind_addr: 192.168.1.120

ru_sdr:
  # "realtime", matching satellite 1 - see the note there for the measurement showing it cannot be dropped.
  device_args: serveraddr=127.0.0.1,serverport=4043,options=chanmod,realtime

  # tx_gain_backoff is deliberately NOT overridden: this cell keeps the base config's 12 dB, same as
  # satellite 1.

cell_cfg:
  # SD-Core is provisioned for sst 1 / sd 0x010203 (66051), not the base config's sd 1.
  # This, the tai_slice_support_list above and the UE's --uicc0.nssai_sd must all agree.
  slicing:
    - sst: 1
      sd: 66051

  pci: 2

  ntn:
    # THE SECOND SATELLITE.
    ephemeris_info_ecef:
      pos_x: 0
      pos_y: 0.0
      pos_z: 6956752.3
      vel_x: 0
      vel_y: 7569.47
      vel_z: 0.00

log:
  filename: /tmp/gnb_leo_sat2.log

pcap:
  ngap_filename: /tmp/ntn_leo_sat2_ngap.pcap
  xnap_enable: true
  xnap_filename: /tmp/ntn_leo_sat2_xnap.pcap
