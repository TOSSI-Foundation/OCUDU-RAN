# O-DU with the Sionna ray-traced channel over a ZMQ transport.
f1ap:
  cu_cp_addr: 127.0.10.1
  bind_addr: 127.0.1.2

f1u:
  socket:
    -
      bind_addr: 127.0.1.2

expert_phy:
  allow_request_on_empty_uplink_slot: true

# srate must match the cell bandwidth. Add cir=<path>/manifest.json to device_args
# to start from a fixed channel instead of passthrough.
ru_sdr:
  device_driver: sionna
  device_args: tx_port=tcp://127.0.0.1:4556,rx_port=tcp://127.0.0.1:4557,live=tcp://127.0.0.1:5566
  srate: 61.44
  tx_gain: 80
  rx_gain: 40

cell_cfg:
  dl_arfcn: 632628                 # 3489.42 MHz
  band: 78
  channel_bandwidth_MHz: 40
  common_scs: 30
  plmn: "00101"
  tac: 1
  pci: 1
  nof_antennas_dl: 1
  nof_antennas_ul: 1


  strict_slice_admission: false

  prach:
    preamble_trans_max: 200
    total_nof_ra_preambles: 64

  sib:
    n310: 10
    t310: 2000
    n311: 1
    t311: 3000


  pdcch:
    common:
      ss1_n_candidates: [0, 0, 2, 1, 0]


  slicing:
    - sst: 1
      sd: 1
      sched_cfg:
        min_prb_policy_ratio: 40
        max_prb_policy_ratio: 100
        ded_prb_policy_ratio: 20
        min_prb_policy_ratio_ul: 25
        max_prb_policy_ratio_ul: 80
        ded_prb_policy_ratio_ul: 10
        administrative_state: "UNLOCKED"
    - sst: 1
      sd: 2
      sched_cfg:
        min_prb_policy_ratio: 20
        max_prb_policy_ratio: 50
        ded_prb_policy_ratio: 15
        administrative_state: "UNLOCKED"
    - sst: 1                          # sd4 — mMTC: administrative revoke demo
      sd: 4
      sched_cfg:
        min_prb_policy_ratio: 20
        max_prb_policy_ratio: 60
        ded_prb_policy_ratio: 10
        administrative_state: "LOCKED"

log:
  filename: du.log
  all_level: info
  phy_level: warning
  fapi_level: warning

metrics:
  enable_log: true              # master gate (default false) -> prints "Scheduler slice"/"Scheduler cell"
  periodicity:
    du_report_period: 1000      # ms between reports (default 1000)
  layers:
    enable_sched: true          # scheduler metrics (default true, set explicit)